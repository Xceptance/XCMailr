<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>

<div th:fragment="content" class="py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-8 col-lg-6">
            <div class="error-container p-4 p-md-5 rounded-4 shadow-sm bg-body">
                <div class="error-badge mb-3">
                    <span class="badge rounded-pill bg-danger-subtle text-danger border border-danger-subtle px-3 py-2 fs-6">
                        <i class="bi bi-exclamation-triangle me-1"></i> HTTP 500
                    </span>
                </div>
                <h1 class="display-3 fw-bold text-body-emphasis mb-3">Internal Server Error</h1>
                <p class="lead text-secondary mb-4">
                    An unexpected error occurred while processing your request. Our system recorded this incident, and we apologize for the inconvenience.
                </p>
                <div th:if="${path}" class="text-muted small font-monospace bg-body-tertiary p-2 rounded mb-4 text-break">
                    <span class="fw-semibold">Requested path:</span> <span th:text="${path}">/example</span>
                </div>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-house me-1"></i> Return to Dashboard
                    </a>
                    <button type="button" class="btn btn-outline-secondary px-4 py-2" onclick="window.location.reload()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
