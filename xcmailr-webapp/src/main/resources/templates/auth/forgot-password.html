<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<head>
    <title>Forgot Password - XCMailr</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Password Recovery</h2>
                    <p class="text-muted">Enter your account email to receive a password reset link</p>
                </div>

                <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                    Error message
                </div>

                <form th:action="@{/forgot-password}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="mail" class="form-label fw-semibold">Email address</label>
                        <input type="email" class="form-control" id="mail" name="mail" required autofocus placeholder="name@example.com">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-semibold">Send Reset Link</button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <a th:href="@{/login}" class="text-decoration-none small fw-semibold">&larr; Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
