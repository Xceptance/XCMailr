<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<head>
    <title>Reset Password - XCMailr</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Set New Password</h2>
                    <p class="text-muted">Enter a new secure password for your account</p>
                </div>

                <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                    Error message
                </div>

                <form th:action="@{'/pwreset/' + ${token}}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Minimum 6 characters">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Repeat new password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-semibold">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
