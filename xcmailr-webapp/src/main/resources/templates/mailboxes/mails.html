<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- Breadcrumb & Header -->
    <nav aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/mailboxes}" th:text="#{mail.allMails.breadcrumbMailboxes}">Mailboxes</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${mailbox.fullAddress}">test@example.com</li>
        </ol>
    </nav>

    <div class="row mb-4 align-items-center">
        <div class="col-md-7">
            <div class="d-flex align-items-center gap-2">
                <h2 class="fw-bold mb-0 text-break" th:text="${mailbox.fullAddress}">test@example.com</h2>
                <span th:if="${mailbox.active}" class="badge bg-success-subtle text-success-emphasis border border-success-subtle rounded-pill">
                    <span class="status-dot status-dot-active"></span><span th:text="#{common.status.active}">Active</span>
                </span>
                <span th:unless="${mailbox.active}" class="badge bg-body-secondary text-secondary border border-secondary-subtle rounded-pill">
                    <span class="status-dot status-dot-expired"></span><span th:text="#{common.status.expired}">Expired</span>
                </span>
            </div>
            <p class="text-muted small mb-0 mt-1">
                <span th:text="#{mailbox.table.column.expires} + ':'">Expires:</span>
                <span th:if="${mailbox.ts_Active == 0}" class="text-success-emphasis fw-medium" th:text="#{common.status.unlimited}">Unlimited</span>
                <time th:unless="${mailbox.ts_Active == 0}" class="local-time" th:datetime="${isoFormatter != null ? isoFormatter.format(T(java.time.Instant).ofEpochMilli(mailbox.ts_Active)) : T(java.time.Instant).ofEpochMilli(mailbox.ts_Active).toString()}" th:text="${dateFormatter.format(T(java.time.Instant).ofEpochMilli(mailbox.ts_Active))}">2026-10-01 12:00:00</time>
                &bull; <span th:text="#{mailbox.table.column.forwards} + ':'">Forwards:</span> <strong th:text="${mailbox.forwards}">0</strong>
                &bull; <span th:text="#{mailbox.table.column.suppressed} + ':'">Suppressed:</span> <strong th:text="${mailbox.suppressions}">0</strong>
            </p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" type="button"
                        th:attr="hx-get=@{'/mailboxes/' + ${mailbox.id} + '/mails'},hx-target='#mail-list-container',hx-swap='outerHTML'">
                    <i class="bi bi-arrow-clockwise me-1"></i> <span th:text="#{mail.allMails.refresh}">Refresh Inbox</span>
                </button>
                <button class="btn btn-outline-danger" type="button"
                        th:attr="hx-delete=@{'/mailboxes/' + ${mailbox.id} + '/mails'},hx-target='#mail-list-container',hx-swap='outerHTML',hx-confirm=#{mail.single.purgeConfirm}">
                    <i class="bi bi-trash me-1"></i> <span th:text="#{mail.single.purgeAll}">Purge All Mails</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Split view: Message List on Left/Top, Message Detail on Right/Bottom -->
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-2 fw-semibold">
                    <span th:text="#{mail.allMails.inboxMessages}">Inbox Messages</span> (<span th:text="${#lists.size(mails)}">0</span>)
                </div>
                <div th:replace="~{mailboxes/fragments/mail-list :: mailList}"></div>
            </div>
        </div>

        <div class="col-lg-7">
            <div id="mail-viewer-pane">
                <div class="card border-0 shadow-sm p-5 text-center text-muted">
                    <div class="py-5">
                        <i class="bi bi-inbox display-3 text-secondary opacity-50"></i>
                        <h5 class="mt-3" th:text="#{mail.allMails.selectPromptTitle}">Select an email to view</h5>
                        <p class="small text-muted mb-0" th:text="#{mail.allMails.selectPromptSubtitle}">Choose an email from the list to preview its sanitized HTML and attachments.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
