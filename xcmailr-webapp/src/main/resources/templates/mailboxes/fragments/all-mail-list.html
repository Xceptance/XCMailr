<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="mailList" id="mail-list-container"
     th:attr="hx-get=@{/mails(page=${currentPage != null ? currentPage : 0}, size=${pageSize != null ? pageSize : 25})},hx-trigger='mailListChanged from:body',hx-target='#mail-list-container',hx-swap='outerHTML'">
    <div class="table-responsive bg-white rounded shadow-sm border">
        <table class="table table-hover table-middle mb-0" id="mail-list-table">
            <thead class="table-light">
                <tr>
                    <th scope="col" class="d-none d-md-table-cell" style="width: 140px;">Received</th>
                    <th scope="col">Message &amp; Recipient</th>
                    <th scope="col" class="text-end" style="width: 1%; white-space: nowrap;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${(mailPage != null and totalElements == 0) or #lists.isEmpty(mails)}">
                    <td colspan="3" class="text-center text-muted py-5 empty-inbox-state">
                        <i class="bi bi-envelope-open display-6 d-block mb-2 text-secondary opacity-50"></i>
                        <em>No messages received across your mailboxes yet.</em>
                    </td>
                </tr>

                <tr th:each="m : ${mails}" th:id="'mail-row-' + ${m.id}" style="cursor: pointer;"
                    class="mail-row"
                    hx-trigger="click"
                    th:attr="hx-get=@{'/mailboxes/' + ${m.mailboxId} + '/mails/' + ${m.id}},hx-target='#mail-viewer-pane',hx-swap='innerHTML'">
                    <td class="d-none d-md-table-cell text-nowrap text-muted small">
                        <time class="local-time" th:datetime="${isoFormatter != null ? isoFormatter.format(T(java.time.Instant).ofEpochMilli(m.receiveTime)) : T(java.time.Instant).ofEpochMilli(m.receiveTime).toString()}" th:text="${dateFormatter.format(T(java.time.Instant).ofEpochMilli(m.receiveTime))}">2026-10-01 12:00:00</time>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-1 flex-wrap mb-1">
                            <span class="badge bg-light text-dark border recipient-badge"
                                  th:text="${mailboxAddressMap != null and mailboxAddressMap.containsKey(m.mailboxId) ? mailboxAddressMap.get(m.mailboxId) : 'Unknown Mailbox'}">
                                mailbox@example.com
                            </span>
                            <span class="small text-muted d-md-none ms-auto">
                                <i class="bi bi-clock me-1"></i>
                                <time class="local-time" th:datetime="${isoFormatter != null ? isoFormatter.format(T(java.time.Instant).ofEpochMilli(m.receiveTime)) : T(java.time.Instant).ofEpochMilli(m.receiveTime).toString()}" th:text="${dateFormatter.format(T(java.time.Instant).ofEpochMilli(m.receiveTime))}">12:00</time>
                            </span>
                        </div>
                        <div class="fw-semibold text-break mail-sender" th:text="${m.sender}">
                            sender@example.com
                        </div>
                        <div class="small text-body-secondary text-break mail-subject" th:text="${m.subject}">
                            Subject line
                        </div>
                    </td>
                    <td class="text-end text-nowrap align-middle" onclick="event.stopPropagation();">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{'/mailboxes/' + ${m.mailboxId} + '/mails/' + ${m.id}}"
                               class="btn btn-outline-secondary btn-touch-target p-2" title="Open full view">
                                <i class="bi bi-box-arrow-up-right"></i>
                            </a>
                            <button class="btn btn-outline-danger btn-touch-target p-2" type="button"
                                    th:attr="hx-delete=@{'/mailboxes/' + ${m.mailboxId} + '/mails/' + ${m.id}},hx-swap='none',hx-confirm='Delete this email?'"
                                    title="Delete email">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- HTMX Pagination Controls -->
        <nav th:if="${mailPage != null and totalPages != null and totalPages > 0}" aria-label="Mail pagination" class="d-flex justify-content-between align-items-center p-3 border-top flex-wrap gap-2">
            <div class="text-muted small">
                Showing <span class="fw-semibold" th:text="${mailPage.numberOfElements}">1</span> of <span class="fw-semibold" th:text="${totalElements}">1</span> messages
            </div>
            <ul class="pagination pagination-sm mb-0">
                <!-- First Page -->
                <li class="page-item" th:classappend="${mailPage.first ? 'disabled' : ''}">
                    <a class="page-link pagination-first"
                       th:href="@{/mails(page=0, size=${pageSize != null ? pageSize : 25})}"
                       th:attr="hx-get=@{/mails(page=0, size=${pageSize != null ? pageSize : 25})},hx-target='#mail-list-container',hx-swap='outerHTML',hx-push-url='true'"
                       aria-label="First">&laquo;</a>
                </li>
                <!-- Previous Page -->
                <li class="page-item" th:classappend="${!mailPage.hasPrevious() ? 'disabled' : ''}">
                    <a class="page-link pagination-prev"
                       th:href="@{/mails(page=${currentPage != null and currentPage > 0 ? currentPage - 1 : 0}, size=${pageSize != null ? pageSize : 25})}"
                       th:attr="hx-get=@{/mails(page=${currentPage != null and currentPage > 0 ? currentPage - 1 : 0}, size=${pageSize != null ? pageSize : 25})},hx-target='#mail-list-container',hx-swap='outerHTML',hx-push-url='true'"
                       aria-label="Previous">&lsaquo;</a>
                </li>
                <!-- Page Numbers -->
                <li th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, (currentPage != null ? currentPage : 0) - 2), T(java.lang.Math).min(totalPages - 1, (currentPage != null ? currentPage : 0) + 2))}"
                    class="page-item"
                    th:classappend="${i == (currentPage != null ? currentPage : 0) ? 'active' : ''}">
                    <a class="page-link pagination-num"
                       th:href="@{/mails(page=${i}, size=${pageSize != null ? pageSize : 25})}"
                       th:attr="hx-get=@{/mails(page=${i}, size=${pageSize != null ? pageSize : 25})},hx-target='#mail-list-container',hx-swap='outerHTML',hx-push-url='true'"
                       th:text="${i + 1}">1</a>
                </li>
                <!-- Next Page -->
                <li class="page-item" th:classappend="${!mailPage.hasNext() ? 'disabled' : ''}">
                    <a class="page-link pagination-next"
                       th:href="@{/mails(page=${currentPage != null and currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1}, size=${pageSize != null ? pageSize : 25})}"
                       th:attr="hx-get=@{/mails(page=${currentPage != null and currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1}, size=${pageSize != null ? pageSize : 25})},hx-target='#mail-list-container',hx-swap='outerHTML',hx-push-url='true'"
                       aria-label="Next">&rsaquo;</a>
                </li>
                <!-- Last Page -->
                <li class="page-item" th:classappend="${mailPage.last ? 'disabled' : ''}">
                    <a class="page-link pagination-last"
                       th:href="@{/mails(page=${totalPages - 1}, size=${pageSize != null ? pageSize : 25})}"
                       th:attr="hx-get=@{/mails(page=${totalPages - 1}, size=${pageSize != null ? pageSize : 25})},hx-target='#mail-list-container',hx-swap='outerHTML',hx-push-url='true'"
                       aria-label="Last">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</body>
</html>
