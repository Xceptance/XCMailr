<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="mailList" id="mail-list-container">
    <div class="table-responsive bg-white rounded shadow-sm border">
        <table class="table table-hover table-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" style="min-width: 150px;">Received</th>
                    <th scope="col" style="min-width: 180px;">From</th>
                    <th scope="col">Subject</th>
                    <th scope="col" class="text-end" style="width: 130px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(mails)}">
                    <td colspan="4" class="text-center text-muted py-5">
                        <em>No emails received in this mailbox yet.</em>
                    </td>
                </tr>

                <tr th:each="m : ${mails}" th:id="'mail-row-' + ${m.id}" style="cursor: pointer;"
                    th:attr="hx-get=@{'/mailboxes/' + ${mailbox.id} + '/mails/' + ${m.id}},hx-target='#mail-viewer-pane',hx-swap='innerHTML'">
                    <td class="text-nowrap text-muted small" th:text="${dateFormatter.format(T(java.time.Instant).ofEpochMilli(m.receiveTime))}">
                        2026-10-01 12:00:00
                    </td>
                    <td class="fw-semibold text-break" th:text="${m.sender}">
                        sender@example.com
                    </td>
                    <td class="text-break" th:text="${m.subject}">
                        Subject line
                    </td>
                    <td class="text-end" onclick="event.stopPropagation();">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{'/mailboxes/' + ${mailbox.id} + '/mails/' + ${m.id}}"
                               class="btn btn-outline-primary" title="Open full view">
                                View
                            </a>
                            <button class="btn btn-outline-danger" type="button"
                                    th:attr="hx-delete=@{'/mailboxes/' + ${mailbox.id} + '/mails/' + ${m.id}},hx-target='#mail-list-container',hx-swap='outerHTML',hx-confirm='Delete this email?'"
                                    title="Delete email">
                                &times;
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
