<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="modal" class="modal-dialog">
    <div class="modal-content">
        <form hx-post="/mailboxes" hx-target="#mailbox-table-container" hx-swap="outerHTML"
              onsubmit="const m = bootstrap.Modal.getInstance(document.getElementById('actionModal')); if(m) m.hide();">
            <div class="modal-header">
                <h5 class="modal-title">Create Temporary Mailbox</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="addressInput" class="form-label">Address Prefix (leave blank for random)</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="addressInput" name="address"
                               th:placeholder="${suggestedAddress}"
                               pattern="[a-zA-Z0-9!#$%&'*+/=?^_`{|}~.-]*"
                               title="Letters, digits, and standard email characters">
                        <span class="input-group-text">@</span>
                        <select class="form-select" id="domainSelect" name="domain" required>
                            <option th:each="d : ${domains}" th:value="${d.domainname}" th:text="${d.domainname}">
                                example.com
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="durationSelect" class="form-label">Active Duration</label>
                    <select class="form-select" id="durationSelect" name="durationHours">
                        <option value="1">1 Hour</option>
                        <option value="2" selected>2 Hours</option>
                        <option value="24">1 Day (24 Hours)</option>
                        <option value="168">1 Week (7 Days)</option>
                        <option value="720">30 Days</option>
                        <option value="0">Unlimited (No expiration)</option>
                    </select>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="forwardCheck" name="forwardEmails" value="true" checked>
                    <label class="form-check-label" for="forwardCheck">
                        Forward incoming emails to my account address
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Mailbox</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
