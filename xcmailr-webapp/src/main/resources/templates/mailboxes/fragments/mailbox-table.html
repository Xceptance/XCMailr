<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="table" id="mailbox-table-container">
    <div class="table-responsive bg-white rounded shadow-sm border">
        <table class="table table-hover table-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" style="min-width: 220px;">Address</th>
                    <th scope="col" style="width: 100px;">Status</th>
                    <th scope="col" style="min-width: 150px;">Expires</th>
                    <th scope="col" class="text-center" style="width: 90px;" title="Total forwarded emails">Forwards</th>
                    <th scope="col" class="text-center" style="width: 100px;" title="Suppressed incoming emails while inactive">Suppressed</th>
                    <th scope="col" class="text-center" style="width: 80px;" title="Stored emails in webmail inbox">Mails</th>
                    <th scope="col" class="text-end" style="min-width: 190px;">Actions</th>
                </tr>
            </thead>
            <tbody id="mailbox-rows">
                <tr th:if="${#lists.isEmpty(mailboxes)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        <em>No mailboxes found matching the criteria.</em>
                    </td>
                </tr>

                <tr th:each="box : ${mailboxes}" th:id="'mailbox-row-' + ${box.id}">
                    <td>
                        <div class="d-flex align-items-center">
                            <span class="fw-semibold text-break" th:text="${box.fullAddress}">test@example.com</span>
                            <button class="btn btn-link btn-sm text-secondary p-0 ms-2" type="button"
                                    th:attr="onclick='navigator.clipboard.writeText(\'' + ${box.fullAddress} + '\')'"
                                    title="Copy address to clipboard">
                                📋
                            </button>
                        </div>
                        <small class="text-muted" th:if="${box.forwardEmails}">
                            &rarr; forwards to user
                        </small>
                        <small class="text-muted text-warning" th:unless="${box.forwardEmails}">
                            &times; forwarding disabled
                        </small>
                    </td>

                    <td>
                        <span th:if="${box.active}" class="badge bg-success">Active</span>
                        <span th:unless="${box.active}" class="badge bg-secondary">Expired</span>
                    </td>

                    <td>
                        <span th:if="${box.ts_Active == 0}" class="text-success fw-semibold">Unlimited</span>
                        <span th:unless="${box.ts_Active == 0}" th:text="${dateFormatter.format(T(java.time.Instant).ofEpochMilli(box.ts_Active))}">2026-10-01 12:00</span>
                    </td>

                    <td class="text-center" th:text="${box.forwards}">0</td>
                    <td class="text-center" th:text="${box.suppressions}">0</td>

                    <td class="text-center">
                        <a th:href="@{'/mailboxes/' + ${box.id} + '/mails'}" class="badge bg-primary text-decoration-none"
                           th:text="${mailCounts.get(box.id) != null ? mailCounts.get(box.id) : 0}">
                            0
                        </a>
                    </td>

                    <td class="text-end">
                        <div class="btn-group btn-group-sm" role="group">
                            <!-- Toggle Active/Inactive -->
                            <button class="btn btn-outline-secondary" type="button"
                                    th:attr="hx-post=@{'/mailboxes/' + ${box.id} + '/toggle'},hx-target='#mailbox-table-container',hx-swap='outerHTML'"
                                    th:title="${box.active ? 'Deactivate mailbox' : 'Activate mailbox'}">
                                <span th:if="${box.active}">Disable</span>
                                <span th:unless="${box.active}">Enable</span>
                            </button>

                            <!-- Quick Extend 24h -->
                            <button class="btn btn-outline-secondary" type="button"
                                    th:attr="hx-post=@{'/mailboxes/' + ${box.id} + '/extend?hours=24'},hx-target='#mailbox-table-container',hx-swap='outerHTML'"
                                    title="Extend validity by 24 hours">
                                +24h
                            </button>

                            <!-- Dropdown for more actions -->
                            <div class="btn-group btn-group-sm" role="group">
                                <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end shadow">
                                    <li>
                                        <a class="dropdown-item" th:href="@{'/mailboxes/' + ${box.id} + '/mails'}">
                                            Inbox Mails
                                        </a>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button"
                                                th:attr="hx-get=@{'/mailboxes/' + ${box.id} + '/edit'},hx-target='#modal-container',hx-swap='innerHTML'"
                                                data-bs-toggle="modal" data-bs-target="#actionModal">
                                            Edit Settings
                                        </button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button"
                                                th:attr="hx-post=@{'/mailboxes/' + ${box.id} + '/reset-counters'},hx-target='#mailbox-table-container',hx-swap='outerHTML'">
                                            Reset Counters
                                        </button>
                                    </li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <button class="dropdown-item text-danger" type="button"
                                                th:attr="hx-delete=@{'/mailboxes/' + ${box.id}},hx-target='#mailbox-table-container',hx-swap='outerHTML',hx-confirm='Are you sure you want to delete ' + ${box.fullAddress} + ' and all its stored emails?'">
                                            Delete Mailbox
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${page.totalPages > 1}">
        <span class="text-muted small">
            Page <strong th:text="${page.number + 1}">1</strong> of <strong th:text="${page.totalPages}">1</strong>
            (<span th:text="${page.totalElements}">0</span> total mailboxes)
        </span>

        <nav aria-label="Mailbox pagination">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
                    <button class="page-link" type="button"
                            th:attr="hx-get=@{/mailboxes(page=${page.number - 1}, search=${search}, status=${status})},hx-target='#mailbox-table-container',hx-swap='outerHTML'">
                        Previous
                    </button>
                </li>

                <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    class="page-item" th:classappend="${i == page.number ? 'active' : ''}">
                    <button class="page-link" type="button" th:text="${i + 1}"
                            th:attr="hx-get=@{/mailboxes(page=${i}, search=${search}, status=${status})},hx-target='#mailbox-table-container',hx-swap='outerHTML'">
                        1
                    </button>
                </li>

                <li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
                    <button class="page-link" type="button"
                            th:attr="hx-get=@{/mailboxes(page=${page.number + 1}, search=${search}, status=${status})},hx-target='#mailbox-table-container',hx-swap='outerHTML'">
                        Next
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</div>

</body>
</html>
