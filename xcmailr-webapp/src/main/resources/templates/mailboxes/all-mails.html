<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- Breadcrumb & Header -->
    <nav aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{mail.allMails.breadcrumbHome}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/mailboxes}" th:text="#{mail.allMails.breadcrumbMailboxes}">Mailboxes</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="#{mail.allMails.breadcrumbAll}">All Mails</li>
        </ol>
    </nav>

    <div class="row mb-4 align-items-center">
        <div class="col-md-7">
            <div class="d-flex align-items-center gap-2">
                <h2 class="fw-bold mb-0" th:text="#{mail.allMails.title}">All Mails</h2>
                <span class="badge bg-primary rounded-pill">
                    <span th:text="${#lists.size(mails)}">0</span> <span th:text="#{mail.allMails.messagesCount}">messages</span>
                </span>
            </div>
            <p class="text-muted small mb-0 mt-1" th:text="#{mail.allMails.subtitle}">
                Unified inbox displaying messages received across all your active mailboxes.
            </p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" type="button"
                        th:attr="hx-get=@{/mails},hx-target='#mail-list-container',hx-swap='outerHTML'">
                    <i class="bi bi-arrow-clockwise me-1"></i> <span th:text="#{mail.allMails.refresh}">Refresh Inbox</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Responsive Split view: Message List on Left/Top (col-12 col-lg-5), Preview Pane on Right/Bottom (col-12 col-lg-7) -->
    <div class="row g-4">
        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-2 fw-semibold d-flex justify-content-between align-items-center">
                    <span th:text="#{mail.allMails.inboxMessages}">Inbox Messages</span>
                    <span class="badge bg-secondary-subtle text-secondary-emphasis" th:text="#{mail.allMails.totalBadge(${#lists.size(mails)})}">0 Total</span>
                </div>
                <div th:replace="~{mailboxes/fragments/all-mail-list :: mailList}"></div>
            </div>
        </div>

        <div class="col-12 col-lg-7">
            <div id="mail-viewer-pane">
                <div class="card border-0 shadow-sm p-4 p-md-5 text-center text-muted">
                    <div class="py-4 py-md-5">
                        <i class="bi bi-inbox display-3 text-secondary opacity-50"></i>
                        <h5 class="mt-3" th:text="#{mail.allMails.selectPromptTitle}">Select an email to view</h5>
                        <p class="small text-muted mb-0" th:text="#{mail.allMails.selectPromptSubtitle}">Choose an email from the list to preview its sanitized HTML and attachments.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
