<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h2 class="fw-bold mb-1" th:text="#{admin.domains.title}">Domain Whitelist</h2>
            <p class="text-muted mb-0" th:text="#{admin.domains.subtitle}">Configure domains allowed for virtual mailboxes and user accounts.</p>
        </div>
    </div>

    <!-- Alert banners -->
    <div th:if="${param.created}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="#{admin.domains.alert.created}">Domain added to whitelist successfully.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{common.action.close}" aria-label="Close"></button>
    </div>
    <div th:if="${param.error != null and (param.error == 'duplicateDomain' or param.error[0] == 'duplicateDomain')}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="#{admin.domains.alert.duplicate}">This domain already exists in the whitelist.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{common.action.close}" aria-label="Close"></button>
    </div>

    <!-- Add Domain Form -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
            <form hx-post="/admin/domains" hx-swap="none"
                  class="row g-2 align-items-center"
                  onsubmit="setTimeout(() => { document.getElementById('domainInput').value = ''; }, 100);">
                <div class="col-sm-8 col-md-6 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white">@</span>
                        <input type="text" class="form-control" id="domainInput" name="domainName"
                               th:placeholder="#{admin.domains.addPlaceholder}"
                               placeholder="e.g. mail.example.com"
                               pattern="^[a-zA-Z0-9]+([\-\.]{1}[a-zA-Z0-9]+)*\.[a-zA-Z]{2,63}$"
                               title="Valid fully qualified domain name"
                               required>
                    </div>
                </div>
                <div class="col-sm-4 col-md-3">
                    <button type="submit" class="btn btn-primary w-100" th:text="#{admin.domains.addButton}">Add Domain</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Domains Table -->
    <div th:replace="~{admin/fragments/domain-table :: table}"></div>
</div>

</body>
</html>
