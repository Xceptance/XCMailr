<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <div class="row mb-4 align-items-center">
        <div class="col-md-7">
            <h2 class="fw-bold mb-1" th:text="#{admin.transactions.title}">Transaction Audit Log</h2>
            <p class="text-muted mb-0" th:text="#{admin.transactions.subtitle}">Inspect inbound SMTP traffic, relay outcomes, suppression events, and delivery errors.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <!-- Purge Form -->
            <form th:action="@{/admin/transactions/purge}" method="post" class="d-inline-flex gap-2 align-items-center"
                  th:attr="onsubmit='return confirm(\'' + #{admin.transactions.purge.confirm} + '\');'">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <select class="form-select form-select-sm w-auto" name="days">
                    <option value="7" th:text="#{admin.transactions.purge.7days}">Older than 7 days</option>
                    <option value="30" selected th:text="#{admin.transactions.purge.30days}">Older than 30 days</option>
                    <option value="90" th:text="#{admin.transactions.purge.90days}">Older than 90 days</option>
                    <option value="-1" th:text="#{admin.transactions.purge.all}">All records (Purge All)</option>
                </select>
                <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{admin.transactions.purge.button}">Purge</button>
            </form>
        </div>
    </div>

    <!-- Alert banners -->
    <div th:if="${param.purged}" class="alert alert-info alert-dismissible fade show" role="alert">
        <span th:text="#{admin.transactions.alert.purged}">Transaction logs purged successfully.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{common.action.close}" aria-label="Close"></button>
    </div>

    <!-- Status summary badges -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <span class="text-muted small fw-semibold" th:text="#{admin.transactions.statusOverview}">Status Overview:</span>
                <span th:each="st : ${statusSummary}">
                    <span th:if="${st.statuscode == 300}" class="badge bg-success py-2 px-3">
                        <span th:text="#{admin.transactions.status.forwarded}">Forwarded (300):</span> <strong th:text="${st.count}">0</strong>
                    </span>
                    <span th:if="${st.statuscode == 200}" class="badge bg-warning text-dark py-2 px-3">
                        <span th:text="#{admin.transactions.status.inactive}">Inactive (200):</span> <strong th:text="${st.count}">0</strong>
                    </span>
                    <span th:if="${st.statuscode == 100}" class="badge bg-secondary py-2 px-3">
                        <span th:text="#{admin.transactions.status.unknown}">Unknown (100):</span> <strong th:text="${st.count}">0</strong>
                    </span>
                    <span th:if="${st.statuscode >= 400}" class="badge bg-danger py-2 px-3">
                        <span th:text="#{admin.transactions.status.error(${st.statuscode})}">Error (400):</span> <strong th:text="${st.count}">0</strong>
                    </span>
                </span>
                <span th:if="${#lists.isEmpty(statusSummary)}" class="text-muted small" th:text="#{admin.transactions.status.empty}">No transactions recorded yet.</span>
            </div>
        </div>
    </div>

    <!-- Transaction Table -->
    <div th:replace="~{admin/fragments/transaction-table :: table}"></div>
</div>

</body>
</html>
