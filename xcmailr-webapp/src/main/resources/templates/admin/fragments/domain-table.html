<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="table" id="domain-table-container"
     hx-get="/admin/domains"
     hx-trigger="domainListChanged from:body"
     hx-target="#domain-table-container"
     hx-swap="outerHTML">
    <div class="table-responsive bg-white rounded shadow-sm border">
        <table class="table table-hover table-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" th:text="#{admin.domains.column.domain}">Domain Name</th>
                    <th scope="col" class="text-end" style="width: 120px;" th:text="#{admin.domains.column.actions}">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(domains)}">
                    <td colspan="2" class="text-center text-muted py-4">
                        <em th:text="#{admin.domains.empty}">No domains configured in whitelist.</em>
                    </td>
                </tr>

                <tr th:each="d : ${domains}" th:id="'domain-row-' + ${d.id}">
                    <td>
                        <span class="fw-semibold" th:text="${d.domainname}">example.com</span>
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger" type="button"
                                th:attr="hx-delete=@{'/admin/domains/' + ${d.id}},hx-swap='none',hx-confirm=#{admin.domains.action.removeConfirm(${d.domainname})}"
                                th:title="#{admin.domains.action.remove}"
                                th:text="#{admin.domains.action.remove}"
                                title="Remove domain">
                            Remove
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
