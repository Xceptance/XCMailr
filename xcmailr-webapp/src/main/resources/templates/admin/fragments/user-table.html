<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="table" id="user-table-container"
     hx-get="/admin/users"
     hx-trigger="userListChanged from:body"
     hx-target="#user-table-container"
     hx-swap="outerHTML"
     hx-include="[name='search'], [name='sort'], [name='dir'], [name='size']">

    <!-- Hidden state preservation inputs for active sort criteria and page size -->
    <input type="hidden" name="sort" th:value="${sort}" />
    <input type="hidden" name="dir" th:value="${dir}" />
    <input type="hidden" name="size" th:value="${page.size}" />

    <div class="table-responsive bg-body rounded shadow-sm border">
        <table class="table table-hover table-middle mb-0">
            <thead>
                <tr class="align-middle">
                    <th scope="col">
                        <a href="javascript:void(0)" role="button" class="sortable-header text-decoration-none text-body d-inline-flex align-items-center gap-1 text-nowrap py-1"
                           th:attr="hx-get=@{/admin/users(sort='email', dir=${sort == 'email' ? (dir == 'asc' ? 'desc' : 'asc') : 'asc'}, page=0, size=${page.size}, search=${search})},hx-target='#user-table-container',hx-swap='outerHTML'"
                           th:title="#{admin.users.sort.email}"
                           title="Sort by Email">
                            <span th:text="#{admin.users.column.email}">Email</span>
                            <i th:if="${sort != 'email'}" class="bi bi-chevron-expand sort-icon text-body-secondary opacity-50 ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'email' and dir == 'asc'}" class="bi bi-chevron-up sort-icon text-primary ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'email' and dir == 'desc'}" class="bi bi-chevron-down sort-icon text-primary ms-1" aria-hidden="true"></i>
                        </a>
                    </th>
                    <th scope="col" class="d-none d-md-table-cell">
                        <a href="javascript:void(0)" role="button" class="sortable-header text-decoration-none text-body d-inline-flex align-items-center gap-1 text-nowrap py-1"
                           th:attr="hx-get=@{/admin/users(sort='name', dir=${sort == 'name' ? (dir == 'asc' ? 'desc' : 'asc') : 'asc'}, page=0, size=${page.size}, search=${search})},hx-target='#user-table-container',hx-swap='outerHTML'"
                           th:title="#{admin.users.sort.name}"
                           title="Sort by Name">
                            <span th:text="#{admin.users.column.name}">Name</span>
                            <i th:if="${sort != 'name'}" class="bi bi-chevron-expand sort-icon text-body-secondary opacity-50 ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'name' and dir == 'asc'}" class="bi bi-chevron-up sort-icon text-primary ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'name' and dir == 'desc'}" class="bi bi-chevron-down sort-icon text-primary ms-1" aria-hidden="true"></i>
                        </a>
                    </th>
                    <th scope="col" style="width: 110px;">
                        <a href="javascript:void(0)" role="button" class="sortable-header text-decoration-none text-body d-inline-flex align-items-center gap-1 text-nowrap py-1"
                           th:attr="hx-get=@{/admin/users(sort='status', dir=${sort == 'status' ? (dir == 'asc' ? 'desc' : 'asc') : 'asc'}, page=0, size=${page.size}, search=${search})},hx-target='#user-table-container',hx-swap='outerHTML'"
                           th:title="#{admin.users.sort.status}"
                           title="Sort by Status">
                            <span th:text="#{admin.users.column.status}">Status</span>
                            <i th:if="${sort != 'status'}" class="bi bi-chevron-expand sort-icon text-body-secondary opacity-50 ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'status' and dir == 'asc'}" class="bi bi-chevron-up sort-icon text-primary ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'status' and dir == 'desc'}" class="bi bi-chevron-down sort-icon text-primary ms-1" aria-hidden="true"></i>
                        </a>
                    </th>
                    <th scope="col" class="d-none d-sm-table-cell" style="width: 90px;">
                        <a href="javascript:void(0)" role="button" class="sortable-header text-decoration-none text-body d-inline-flex align-items-center gap-1 text-nowrap py-1"
                           th:attr="hx-get=@{/admin/users(sort='role', dir=${sort == 'role' ? (dir == 'asc' ? 'desc' : 'asc') : 'asc'}, page=0, size=${page.size}, search=${search})},hx-target='#user-table-container',hx-swap='outerHTML'"
                           th:title="#{admin.users.sort.role}"
                           title="Sort by Role">
                            <span th:text="#{admin.users.column.role}">Role</span>
                            <i th:if="${sort != 'role'}" class="bi bi-chevron-expand sort-icon text-body-secondary opacity-50 ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'role' and dir == 'asc'}" class="bi bi-chevron-up sort-icon text-primary ms-1" aria-hidden="true"></i>
                            <i th:if="${sort == 'role' and dir == 'desc'}" class="bi bi-chevron-down sort-icon text-primary ms-1" aria-hidden="true"></i>
                        </a>
                    </th>
                    <th scope="col" class="text-end" style="width: 1%; white-space: nowrap;"><span class="d-inline-flex align-items-center py-1" th:text="#{admin.users.column.actions}">Actions</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <em th:text="#{admin.users.empty}">No user accounts found.</em>
                    </td>
                </tr>

                <tr th:each="u : ${users}" th:id="'user-row-' + ${u.id}">
                    <td>
                        <div class="d-flex align-items-center">
                            <span class="fw-semibold text-break" th:text="${u.mail}">user@example.com</span>
                            <span th:if="${u.id == currentAdmin.id}" class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill ms-2" th:text="#{admin.users.youBadge}">You</span>
                        </div>
                        <div class="small text-muted d-md-none mt-1">
                            <span th:text="${u.forename + ' ' + u.surname}">John Doe</span>
                            <span class="d-sm-none ms-1">
                                &bull; <span th:text="${u.admin ? #messages.msg('admin.users.role.admin') : #messages.msg('admin.users.role.user')}">User</span>
                            </span>
                        </div>
                    </td>
                    <td class="d-none d-md-table-cell" th:text="${u.forename + ' ' + u.surname}">John Doe</td>
                    <td>
                        <span th:if="${u.active}" class="badge bg-success-subtle text-success-emphasis border border-success-subtle rounded-pill">
                            <span class="status-dot status-dot-active"></span><span th:text="#{common.status.active}">Active</span>
                        </span>
                        <span th:unless="${u.active}" class="badge bg-body-secondary text-secondary border border-secondary-subtle rounded-pill">
                            <span class="status-dot status-dot-inactive"></span><span th:text="#{common.status.inactive}">Inactive</span>
                        </span>
                    </td>
                    <td class="d-none d-sm-table-cell">
                        <span th:if="${u.admin}" class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle rounded-pill" th:text="#{admin.users.role.admin}">Admin</span>
                        <span th:unless="${u.admin}" class="badge bg-body-secondary text-secondary border border-secondary-subtle rounded-pill" th:text="#{admin.users.role.user}">User</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <div class="btn-group btn-group-sm" th:if="${u.id != currentAdmin.id}">
                            <!-- Toggle Active Status -->
                            <button class="btn btn-outline-secondary" type="button"
                                    th:attr="hx-post=@{'/admin/users/' + ${u.id} + '/toggle-active'},hx-swap='none'"
                                    th:title="${u.active ? #messages.msg('admin.users.action.deactivate') : #messages.msg('admin.users.action.activate')}">
                                <span th:if="${u.active}" th:text="#{admin.users.action.deactivate}">Deactivate</span>
                                <span th:unless="${u.active}" th:text="#{admin.users.action.activate}">Activate</span>
                            </button>

                            <!-- Toggle Admin Role -->
                            <button class="btn btn-outline-secondary" type="button"
                                    th:attr="hx-post=@{'/admin/users/' + ${u.id} + '/toggle-admin'},hx-swap='none'"
                                    th:title="${u.admin ? #messages.msg('admin.users.action.demote') : #messages.msg('admin.users.action.promote')}">
                                <span th:if="${u.admin}" th:text="#{admin.users.action.demote}">Demote</span>
                                <span th:unless="${u.admin}" th:text="#{admin.users.action.promote}">Promote</span>
                            </button>

                            <!-- Delete User -->
                            <button class="btn btn-outline-danger" type="button"
                                    th:attr="hx-delete=@{'/admin/users/' + ${u.id}},hx-swap='none',hx-confirm=#{admin.users.action.deleteConfirm(${u.mail})}"
                                    th:title="#{admin.users.action.deleteTooltip}"
                                    title="Delete user account">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        <span th:if="${u.id == currentAdmin.id}" class="text-muted small" th:text="#{admin.users.currentAccount}">Current Account</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination & Display Count Controls -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3" th:if="${page.totalElements > 0}">
        <span class="text-muted small">
            <span th:text="#{common.pagination.summary(${page.number + 1}, ${page.totalPages}, ${page.totalElements})}">Page 1 of 1 (0 total)</span>
        </span>

        <!-- Right: Pagination Bar and Display Count Bar -->
        <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
            <!-- 7-Slot Pagination Bar -->
            <nav aria-label="User pagination" th:aria-label="#{common.aria.pagination.users}">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=${page.number - 1}, size=${page.size}, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'"
                                th:disabled="${page.first}"
                                th:text="#{common.pagination.previous}">
                            Previous
                        </button>
                    </li>

                    <th:block th:each="p : ${@paginationHelper.getPageSequence(page.number + 1, page.totalPages)}">
                        <li th:if="${p == -1}" class="page-item disabled" aria-hidden="true">
                            <span class="page-link">&hellip;</span>
                        </li>
                        <li th:if="${p != -1}" class="page-item" th:classappend="${p == page.number + 1 ? 'active' : ''}">
                            <button class="page-link" type="button" th:text="${p}"
                                    th:attr="hx-get=@{/admin/users(page=${p - 1}, size=${page.size}, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'">
                                1
                            </button>
                        </li>
                    </th:block>

                    <li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=${page.number + 1}, size=${page.size}, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'"
                                th:disabled="${page.last}"
                                th:text="#{common.pagination.next}">
                            Next
                        </button>
                    </li>
                </ul>
            </nav>

            <!-- Display Count Selector -->
            <nav aria-label="Page size selector" th:aria-label="#{macro_EntriesPerPage}">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item disabled">
                        <span class="page-link text-muted" th:text="#{macro_EntriesPerPage}">Display Count</span>
                    </li>
                    <li class="page-item" th:classappend="${page.size == 5 ? 'active' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=0, size=5, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'">
                            5
                        </button>
                    </li>
                    <li class="page-item" th:classappend="${page.size == 15 ? 'active' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=0, size=15, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'">
                            15
                        </button>
                    </li>
                    <li class="page-item" th:classappend="${page.size == 25 ? 'active' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=0, size=25, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'">
                            25
                        </button>
                    </li>
                    <li class="page-item" th:classappend="${page.size == 50 ? 'active' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=0, size=50, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'">
                            50
                        </button>
                    </li>
                    <li class="page-item" th:classappend="${page.size >= 1000 or (page.size >= page.totalElements and page.size != 5 and page.size != 15 and page.size != 25 and page.size != 50) ? 'active' : ''}">
                        <button class="page-link" type="button"
                                th:attr="hx-get=@{/admin/users(page=0, size=0, search=${search}, sort=${sort}, dir=${dir})},hx-target='#user-table-container',hx-swap='outerHTML'"
                                th:text="#{common.pagination.all}">
                            all
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

</body>
</html>
